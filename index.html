<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Encuesta en vivo: experiencia programando y uso de IA para escribir código.">
  <title>Encuesta en vivo</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1f2630;
      --border: #2d3540;
      --text: #e6edf3;
      --text-2: #a4afbb;
      --muted: #7d8793;
      --accent: #8b7cf6;
      --accent-strong: #a99cff;
      --bar: #5b6ee1;
      --bar-mine: #a99cff;
      --track: #232a34;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(1200px 500px at 50% -200px, rgba(139, 124, 246, 0.18), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 16px 24px;
      flex: 1;
    }

    header { margin-bottom: 24px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent-strong);
    }

    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f85149;
      box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.6);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0.6); }
      70% { box-shadow: 0 0 0 10px rgba(248, 81, 73, 0); }
      100% { box-shadow: 0 0 0 0 rgba(248, 81, 73, 0); }
    }

    h1 {
      margin: 8px 0 4px;
      font-size: clamp(1.9rem, 6vw, 2.5rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .lead { margin: 0; color: var(--text-2); }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 16px;
      font-size: 1.2rem;
      line-height: 1.35;
    }

    .step {
      display: block;
      margin-bottom: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .options button {
      min-height: 64px;
      padding: 14px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.12s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .options button:hover { border-color: var(--accent); background: #262d39; }
    .options button:active { transform: scale(0.97); }
    .options button:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 2px; }
    .options.stack { grid-template-columns: 1fr; }

    .results { display: none; }
    .card.voted .options { display: none; }
    .card.voted .results { display: block; animation: fade-in 0.35s ease; }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    .row { margin-bottom: 14px; }

    .row-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 0.98rem;
    }

    .row-label .name { color: var(--text); }
    .row-label .mine-tag {
      margin-left: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-strong);
    }

    .row-label .pct {
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .row-label .count { font-weight: 400; color: var(--muted); }

    .track {
      height: 14px;
      border-radius: 4px;
      background: var(--track);
      overflow: hidden;
    }

    .fill {
      height: 100%;
      width: 0;
      border-radius: 0 4px 4px 0;
      background: var(--bar);
      transition: width 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .row.mine .fill { background: var(--bar-mine); }

    .total {
      margin: 16px 0 0;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      color: var(--text-2);
      font-size: 0.95rem;
    }

    .total strong { color: var(--text); font-variant-numeric: tabular-nums; }

    .actions { text-align: center; margin-top: 8px; }

    .reset {
      padding: 10px 14px;
      border: none;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 0.85rem;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }

    .reset:hover { color: var(--text-2); }
    .reset:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; border-radius: 6px; }
    .reset[hidden] { display: none; }

    footer {
      padding: 20px 16px 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
    }

    footer strong { color: var(--accent-strong); font-weight: 600; white-space: nowrap; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 380px) {
      .options { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="badge">En vivo</span>
      <h1>Encuesta en vivo</h1>
      <p class="lead">Dos preguntas rápidas. Toca una opción para votar y ver los resultados.</p>
    </header>

    <div id="questions"></div>

    <div class="actions">
      <button type="button" class="reset" id="reset" hidden>Reiniciar mis votos</button>
    </div>

    <p class="sr-only" id="announcer" aria-live="polite"></p>
  </main>

  <footer>
    Construida en vivo con Claude Code — <strong>Next-Gen Coding</strong>
  </footer>

  <script>
    (function () {
      "use strict";

      var QUESTIONS = [
        {
          id: "experiencia",
          title: "¿Cuántos años llevas programando?",
          options: ["<2", "2-5", "6-10", ">10"]
        },
        {
          id: "ia",
          title: "¿Ya usas IA para escribir código?",
          options: ["Nunca", "A veces", "A diario", "La IA escribe casi todo mi código"]
        }
      ];

      var STORAGE_KEY = "encuesta-viva:v1";

      function emptyState() {
        var state = { tallies: {}, mine: {} };
        QUESTIONS.forEach(function (q) {
          state.tallies[q.id] = q.options.map(function () { return 0; });
        });
        return state;
      }

      function loadState() {
        var state = emptyState();
        try {
          var saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && saved.tallies && saved.mine) {
            QUESTIONS.forEach(function (q) {
              var t = saved.tallies[q.id];
              if (Array.isArray(t) && t.length === q.options.length) {
                state.tallies[q.id] = t.map(function (n) { return Math.max(0, Number(n) || 0); });
              }
              var m = saved.mine[q.id];
              if (Number.isInteger(m) && m >= 0 && m < q.options.length) {
                state.mine[q.id] = m;
              }
            });
          }
        } catch (e) { /* localStorage no disponible o datos corruptos: empezamos de cero */ }
        return state;
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { /* sin persistencia: la sesión sigue funcionando en memoria */ }
      }

      var state = loadState();
      var container = document.getElementById("questions");
      var resetBtn = document.getElementById("reset");
      var announcer = document.getElementById("announcer");
      var cards = {};

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text != null) node.textContent = text;
        return node;
      }

      function buildCard(q, index) {
        var card = el("section", "card");
        card.setAttribute("aria-labelledby", "q-" + q.id);

        card.appendChild(el("span", "step", "Pregunta " + (index + 1) + " de " + QUESTIONS.length));
        var h2 = el("h2", null, q.title);
        h2.id = "q-" + q.id;
        card.appendChild(h2);

        // Si alguna opción es larga, apilamos todas en una columna para no dejar huecos.
        var long = q.options.some(function (label) { return label.length > 12; });
        var options = el("div", long ? "options stack" : "options");
        q.options.forEach(function (label, i) {
          var btn = el("button", null, label);
          btn.type = "button";
          btn.addEventListener("click", function () { vote(q, i); });
          options.appendChild(btn);
        });
        card.appendChild(options);

        var results = el("div", "results");
        var rows = q.options.map(function (label) {
          var row = el("div", "row");
          var labelLine = el("div", "row-label");
          var name = el("span", "name", label);
          var tag = el("span", "mine-tag", "tu voto");
          tag.hidden = true;
          name.appendChild(tag);
          var pct = el("span", "pct");
          labelLine.appendChild(name);
          labelLine.appendChild(pct);

          var track = el("div", "track");
          var fill = el("div", "fill");
          track.appendChild(fill);

          row.appendChild(labelLine);
          row.appendChild(track);
          results.appendChild(row);
          return { row: row, tag: tag, pct: pct, fill: fill, track: track };
        });
        var total = el("p", "total");
        results.appendChild(total);
        card.appendChild(results);

        container.appendChild(card);
        cards[q.id] = { card: card, rows: rows, total: total };
      }

      function renderQuestion(q, animateFromZero) {
        var view = cards[q.id];
        var mine = state.mine[q.id];
        var voted = mine !== undefined;
        view.card.classList.toggle("voted", voted);
        if (!voted) return;

        var tallies = state.tallies[q.id];
        var total = tallies.reduce(function (a, b) { return a + b; }, 0);

        view.rows.forEach(function (r, i) {
          var count = tallies[i];
          var pct = total ? Math.round((count / total) * 100) : 0;
          r.row.classList.toggle("mine", i === mine);
          r.tag.hidden = i !== mine;
          r.pct.innerHTML = "";
          r.pct.appendChild(document.createTextNode(pct + "% "));
          r.pct.appendChild(el("span", "count", "(" + count + ")"));
          var label = q.options[i] + ": " + pct + "%, " + count + (count === 1 ? " voto" : " votos");
          r.track.setAttribute("role", "img");
          r.track.setAttribute("aria-label", label);
          r.track.title = label;
          if (animateFromZero) r.fill.style.width = "0";
          r.target = pct;
        });

        view.total.innerHTML = "";
        view.total.appendChild(document.createTextNode("Total: "));
        view.total.appendChild(el("strong", null, String(total)));
        view.total.appendChild(document.createTextNode(total === 1 ? " voto" : " votos"));

        // Doble rAF para que la transición de ancho arranque desde 0 tras mostrar la tarjeta.
        requestAnimationFrame(function () {
          requestAnimationFrame(function () {
            view.rows.forEach(function (r) { r.fill.style.width = r.target + "%"; });
          });
        });
      }

      function render(animatedIds) {
        QUESTIONS.forEach(function (q) {
          renderQuestion(q, !animatedIds || animatedIds.indexOf(q.id) !== -1);
        });
        resetBtn.hidden = Object.keys(state.mine).length === 0;
      }

      function vote(q, i) {
        if (state.mine[q.id] !== undefined) return;
        state.tallies[q.id][i] += 1;
        state.mine[q.id] = i;
        saveState();
        render([q.id]);
        announcer.textContent = "Voto registrado: " + q.options[i] + ". Resultados actualizados.";
      }

      resetBtn.addEventListener("click", function () {
        QUESTIONS.forEach(function (q) {
          var m = state.mine[q.id];
          if (m !== undefined) {
            state.tallies[q.id][m] = Math.max(0, state.tallies[q.id][m] - 1);
            delete state.mine[q.id];
          }
        });
        saveState();
        render([]);
        announcer.textContent = "Tus votos se reiniciaron. Puedes votar de nuevo.";
        var firstBtn = container.querySelector(".options button");
        if (firstBtn) firstBtn.focus();
      });

      // Sincroniza al instante entre pestañas abiertas en el mismo dispositivo.
      window.addEventListener("storage", function (e) {
        if (e.key !== STORAGE_KEY) return;
        state = loadState();
        render([]);
      });

      QUESTIONS.forEach(buildCard);
      render();
    })();
  </script>
</body>
</html>
